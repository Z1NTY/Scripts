<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Z1NTY // Scripts Hub</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: #0af;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        /* Синий туман на фоне */
        .fog-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .fog-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(ellipse at 20% 50%, rgba(0,120,255,0.08) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 50%, rgba(0,150,255,0.1) 0%, transparent 50%),
                        radial-gradient(ellipse at 50% 50%, rgba(0,100,255,0.06) 0%, transparent 70%);
            animation: fogMove 12s ease-in-out infinite;
        }
        .fog-layer:nth-child(2) {
            animation-delay: -6s;
            opacity: 0.7;
        }
        @keyframes fogMove {
            0%, 100% { transform: scale(1) translateY(0); }
            25% { transform: scale(1.05) translateY(-1vh); }
            50% { transform: scale(1.02) translateY(1vh); }
            75% { transform: scale(1.04) translateY(-0.5vh); }
        }
        /* Контейнер сайта */
        .main-container {
            position: relative;
            z-index: 10;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        /* Заголовок с анимацией */
        .title-wrapper {
            text-align: center;
            padding: 50px 20px 30px;
            opacity: 0;
            animation: titleReveal 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes titleReveal {
            0% { opacity: 0; transform: translateY(-30px); filter: blur(10px); }
            100% { opacity: 1; transform: translateY(0); filter: blur(0); }
        }
        .main-title {
            font-size: clamp(28px, 5vw, 42px);
            font-weight: 900;
            letter-spacing: 5px;
            color: #0af;
            text-shadow: 0 0 20px #0af, 0 0 40px #0af, 0 0 60px #08c;
            margin-bottom: 5px;
        }
        .sub-title {
            font-size: clamp(12px, 2vw, 16px);
            color: #0af;
            opacity: 0.8;
            letter-spacing: 6px;
            text-shadow: 0 0 10px #0af;
        }
        /* Поиск */
        .search-box {
            width: 100%;
            padding: 15px 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border: 2px solid #0af;
            border-radius: 50px;
            color: #0af;
            font-size: 16px;
            margin: 20px 0;
            box-shadow: 0 0 20px rgba(0,170,255,0.2), inset 0 0 15px rgba(0,170,255,0.1);
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
        }
        .search-box:focus {
            box-shadow: 0 0 40px rgba(0,170,255,0.5), inset 0 0 20px rgba(0,170,255,0.2);
            border-color: #4af;
        }
        .search-box::placeholder { color: rgba(0,170,255,0.4); letter-spacing: 2px; }
        /* Сетка плейсов */
        .game-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 40px;
        }
        .game-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 24px;
            border: 1px solid rgba(0,170,255,0.4);
            border-radius: 20px;
            background: rgba(0,170,255,0.03);
            backdrop-filter: blur(5px);
            text-decoration: none;
            color: #0af;
            font-size: clamp(15px, 2.5vw, 18px);
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 15px rgba(0,170,255,0.1);
            opacity: 0;
            transform: translateY(20px);
            animation: rowReveal 0.5s ease forwards;
        }
        .game-row:nth-child(1) { animation-delay: 0.05s; }
        .game-row:nth-child(2) { animation-delay: 0.10s; }
        .game-row:nth-child(3) { animation-delay: 0.15s; }
        .game-row:nth-child(4) { animation-delay: 0.20s; }
        .game-row:nth-child(5) { animation-delay: 0.25s; }
        .game-row:nth-child(6) { animation-delay: 0.30s; }
        .game-row:nth-child(7) { animation-delay: 0.35s; }
        .game-row:nth-child(8) { animation-delay: 0.40s; }
        .game-row:nth-child(9) { animation-delay: 0.45s; }
        .game-row:nth-child(10) { animation-delay: 0.50s; }
        .game-row:nth-child(11) { animation-delay: 0.55s; }
        .game-row:nth-child(12) { animation-delay: 0.60s; }
        .game-row:nth-child(13) { animation-delay: 0.65s; }
        .game-row:nth-child(14) { animation-delay: 0.70s; }
        .game-row:nth-child(15) { animation-delay: 0.75s; }
        .game-row:nth-child(16) { animation-delay: 0.80s; }
        .game-row:nth-child(17) { animation-delay: 0.85s; }
        .game-row:nth-child(18) { animation-delay: 0.90s; }
        .game-row:nth-child(19) { animation-delay: 0.95s; }
        .game-row:nth-child(20) { animation-delay: 1.00s; }
        .game-row:nth-child(21) { animation-delay: 1.05s; }
        .game-row:nth-child(22) { animation-delay: 1.10s; }
        .game-row:nth-child(23) { animation-delay: 1.15s; }
        .game-row:nth-child(24) { animation-delay: 1.20s; }
        .game-row:nth-child(25) { animation-delay: 1.25s; }
        .game-row:nth-child(26) { animation-delay: 1.30s; }
        .game-row:nth-child(27) { animation-delay: 1.35s; }
        .game-row:nth-child(28) { animation-delay: 1.40s; }
        .game-row:nth-child(29) { animation-delay: 1.45s; }
        .game-row:nth-child(30) { animation-delay: 1.50s; }
        .game-row:nth-child(31) { animation-delay: 1.55s; }
        .game-row:nth-child(32) { animation-delay: 1.60s; }
        .game-row:nth-child(33) { animation-delay: 1.65s; }
        .game-row:nth-child(34) { animation-delay: 1.70s; }
        @keyframes rowReveal {
            to { opacity: 1; transform: translateY(0); }
        }
        .game-row:hover {
            background: rgba(0,170,255,0.12);
            border-color: #4af;
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 35px rgba(0,170,255,0.3);
            color: #fff;
        }
        .game-row .emoji {
            font-size: clamp(18px, 3vw, 24px);
            margin-right: 8px;
            filter: drop-shadow(0 0 6px rgba(0,170,255,0.6));
        }
        .game-row .arrow {
            opacity: 0.6;
            transition: all 0.3s;
        }
        .game-row:hover .arrow { opacity: 1; transform: translateX(3px); }
        /* Секции */
        .page-section {
            display: none;
            animation: sectionIn 0.5s ease;
        }
        .page-section.active { display: block; }
        @keyframes sectionIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h2 {
            font-size: clamp(22px, 4vw, 30px);
            text-shadow: 0 0 15px #0af, 0 0 30px #0af;
            margin: 25px 0 15px;
            border-left: 4px solid #0af;
            padding-left: 16px;
            box-shadow: -10px 0 25px rgba(0,170,255,0.2);
            animation: glowPulse 2s infinite alternate;
        }
        @keyframes glowPulse {
            from { border-left-color: #0af; text-shadow: 0 0 10px #0af; }
            to { border-left-color: #4af; text-shadow: 0 0 20px #0af, 0 0 40px #0af; }
        }
        .game-desc {
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,170,255,0.3);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            color: #bcd;
            line-height: 1.6;
            box-shadow: 0 0 20px rgba(0,170,255,0.1);
            font-size: 15px;
        }
        .script-card {
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0,170,255,0.35);
            border-radius: 20px;
            padding: 22px;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(0,170,255,0.15);
            transition: all 0.3s ease;
        }
        .script-card:hover {
            border-color: #4af;
            box-shadow: 0 0 35px rgba(0,170,255,0.3);
            transform: translateY(-2px);
        }
        .script-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .script-name {
            font-weight: 700;
            font-size: clamp(16px, 2.5vw, 19px);
            color: #0af;
            text-shadow: 0 0 8px rgba(0,170,255,0.5);
        }
        .verified-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0,255,100,0.1);
            border: 1px solid rgba(0,255,100,0.4);
            color: #0f7;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-shadow: 0 0 8px rgba(0,255,100,0.6);
            box-shadow: 0 0 12px rgba(0,255,100,0.2);
        }
        .no-key-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(0,255,100,0.08);
            border: 1px solid rgba(0,255,100,0.3);
            color: #0f7;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-shadow: 0 0 6px rgba(0,255,100,0.5);
        }
        .key-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255,60,60,0.1);
            border: 1px solid rgba(255,60,60,0.4);
            color: #f55;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-shadow: 0 0 6px rgba(255,60,60,0.5);
        }
        pre {
            background: #000;
            border: 1px solid rgba(0,170,255,0.3);
            border-radius: 14px;
            padding: 16px;
            overflow-x: auto;
            color: #ddd;
            font-size: 12px;
            margin-bottom: 14px;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.5;
        }
        .copy-btn {
            display: block;
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 2px solid #0af;
            border-radius: 50px;
            color: #0af;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 18px rgba(0,170,255,0.2);
            text-shadow: 0 0 8px rgba(0,170,255,0.6);
        }
        .copy-btn:hover {
            background: #0af;
            color: #000;
            box-shadow: 0 0 35px #0af;
        }
        .copy-btn.copied {
            background: #0f7;
            border-color: #0f7;
            color: #000;
        }
        .date-tag {
            text-align: right;
            color: rgba(255,80,80,0.7);
            font-size: 11px;
            margin-top: 6px;
        }
        .back-link {
            display: inline-block;
            padding: 10px 22px;
            border: 1px solid #0af;
            border-radius: 30px;
            color: #0af;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
            margin-bottom: 15px;
            text-shadow: 0 0 6px #0af;
        }
        .back-link:hover {
            background: #0af;
            color: #000;
            box-shadow: 0 0 25px #0af;
        }
        /* Copilot */
        .copilot-trigger {
            position: fixed;
            right: 18px;
            bottom: 100px;
            z-index: 999;
            width: 62px;
            height: 62px;
            border-radius: 50%;
            background: rgba(0,170,255,0.1);
            border: 2px solid #0af;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(0,170,255,0.4), 0 0 50px rgba(0,170,255,0.15);
            transition: all 0.3s ease;
            animation: float 2.5s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .copilot-trigger:hover {
            box-shadow: 0 0 45px rgba(0,170,255,0.8);
            transform: scale(1.08);
        }
        .copilot-trigger .icon {
            font-size: 24px;
            filter: drop-shadow(0 0 6px #0af);
        }
        .copilot-label {
            font-size: 10px;
            color: #0af;
            margin-top: -2px;
            text-shadow: 0 0 6px #0af;
            font-weight: 700;
            letter-spacing: 1px;
        }
        /* Copilot окно */
        .copilot-window {
            position: fixed;
            right: 18px;
            bottom: 110px;
            width: 95vw;
            max-width: 380px;
            height: 500px;
            max-height: 70vh;
            background: rgba(0,0,0,0.92);
            backdrop-filter: blur(15px);
            border: 1px solid #0af;
            border-radius: 20px;
            z-index: 1000;
            display: none;
            flex-direction: column;
            box-shadow: 0 0 50px rgba(0,170,255,0.35);
            animation: windowIn 0.3s ease;
        }
        @keyframes windowIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .copilot-window.open { display: flex; }
        .copilot-header {
            padding: 15px;
            border-bottom: 1px solid rgba(0,170,255,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .copilot-title {
            font-weight: 800;
            color: #0af;
            text-shadow: 0 0 10px #0af;
            letter-spacing: 2px;
        }
        .copilot-close {
            background: none;
            border: none;
            color: #f55;
            font-size: 22px;
            cursor: pointer;
        }
        .mode-buttons {
            display: flex;
            gap: 8px;
            padding: 10px 15px;
            border-bottom: 1px solid rgba(0,170,255,0.1);
        }
        .mode-btn {
            flex: 1;
            padding: 8px 6px;
            border: 1px solid rgba(0,170,255,0.3);
            border-radius: 12px;
            background: transparent;
            color: #0af;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.3s;
            text-align: center;
        }
        .mode-btn.active {
            background: rgba(0,170,255,0.2);
            border-color: #4af;
            box-shadow: 0 0 15px rgba(0,170,255,0.4);
        }
        .copilot-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .copilot-msg {
            max-width: 90%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.5;
            animation: msgIn 0.25s ease;
        }
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .copilot-msg.bot {
            background: rgba(0,170,255,0.08);
            border: 1px solid rgba(0,170,255,0.25);
            color: #bcd;
            align-self: flex-start;
        }
        .copilot-msg.user {
            background: rgba(0,170,255,0.15);
            border: 1px solid rgba(0,170,255,0.4);
            color: #fff;
            align-self: flex-end;
        }
        .copilot-input-area {
            display: flex;
            padding: 10px;
            gap: 8px;
            border-top: 1px solid rgba(0,170,255,0.2);
        }
        .copilot-input {
            flex: 1;
            padding: 12px;
            background: #000;
            border: 1px solid rgba(0,170,255,0.4);
            border-radius: 25px;
            color: #fff;
            outline: none;
            font-size: 13px;
        }
        .copilot-send {
            padding: 10px 16px;
            background: #0af;
            border: none;
            border-radius: 25px;
            color: #000;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .copilot-send:hover { box-shadow: 0 0 20px #0af; }
        @media (max-width: 480px) {
            .copilot-window { right: 4px; bottom: 100px; width: 96vw; }
            .copilot-trigger { right: 8px; bottom: 80px; width: 54px; height: 54px; }
        }
    </style>
</head>

    const grid = document.getElementById('gameGrid');
    const pagesContainer = document.getElementById('pagesContainer');
    const searchInput = document.getElementById('searchInput');
    const homePage = document.getElementById('homePage');
    let currentPage = 'home';

    games.forEach((game, index) => {
        // Строчка в главном меню
        const row = document.createElement('a');
        row.href = `#${game.id}`;
        row.className = 'game-row';
        row.dataset.game = game.id;
        row.innerHTML = `<span><span class="emoji">${game.emoji}</span>${game.name}</span><span class="arrow">→</span>`;
        grid.appendChild(row);

        // Страница плейса
        const page = document.createElement('div');
        page.id = `${game.id}-page`;
        page.className = 'page-section';
        let scriptsHTML = '';
        game.scripts.forEach((s, si) => {
            const verifiedHTML = s.verified ? '<span class="verified-badge">✅ Верифицирован владельцем сайта</span>' : '';
            const keyHTML = s.key ? '<span class="key-badge">🔑 Key System</span>' : '<span class="no-key-badge">✅ No Key</span>';
            scriptsHTML += `
                <div class="script-card">
                    <div class="script-header">
                        <span class="script-name">${s.title}</span>
                        <div style="display:flex;gap:6px;flex-wrap:wrap;">${verifiedHTML}${keyHTML}</div>
                    </div>
                    <pre id="script-${game.id}-${si}">${s.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</pre>
                    <button class="copy-btn" onclick="copyCode('script-${game.id}-${si}', this)">📋 Copy Script</button>
                    <div class="date-tag">23 June 2026</div>
                </div>`;
        });
        page.innerHTML = `
            <a href="#" class="back-link" onclick="showHome()">← На главную</a>
            <h2>${game.emoji} ${game.name}</h2>
            <div class="game-desc">${game.desc}</div>
            ${scriptsHTML}`;
        pagesContainer.appendChild(page);
    });

    function showHome() {
        document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
        homePage.classList.add('active');
        currentPage = 'home';
        window.location.hash = '';
        if (searchInput) searchInput.value = '';
    }

    function showGame(id) {
        document.querySelectorAll('.page-section').forEach(p => p.classList.remove('active'));
        homePage.classList.remove('active');
        const target = document.getElementById(`${id}-page`);
        if (target) { target.classList.add('active'); currentPage = id; }
        window.location.hash = id;
        if (searchInput) searchInput.value = '';
    }

    document.querySelectorAll('[data-game]').forEach(row => {
        row.addEventListener('click', function(e) {
            e.preventDefault();
            showGame(this.dataset.game);
        });
    });

    window.addEventListener('load', () => {
        const hash = window.location.hash.slice(1);
        if (hash && document.getElementById(`${hash}-page`)) showGame(hash);
        else showHome();
    });

    window.addEventListener('hashchange', () => {
        const hash = window.location.hash.slice(1);
        if (hash && document.getElementById(`${hash}-page`)) showGame(hash);
        else showHome();
    });

    if (searchInput) {
        searchInput.addEventListener('input', function() {
            if (currentPage !== 'home') return;
            const val = this.value.toLowerCase();
            document.querySelectorAll('[data-game]').forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(val) ? 'flex' : 'none';
            });
        });
    }

    function copyCode(blockId, btn) {
        const text = document.getElementById(blockId).innerText;
        navigator.clipboard.writeText(text).then(() => {
            btn.innerText = '✅ Скопировано!';
            btn.classList.add('copied');
            setTimeout(() => { btn.innerText = '📋 Copy Script'; btn.classList.remove('copied'); }, 2000);
        }).catch(() => alert('Ошибка копирования'));
    }

    const BYPASS_KEY = 'bt_9ce0dc7a030a8dd52e2def9614aab0a77f0a2a2a8fecadd2';
    let copilotMode = 'helper'; // helper | bypass

    const trigger = document.getElementById('copilotTrigger');
    const window_el = document.getElementById('copilotWindow');
    const closeBtn = document.getElementById('copilotClose');
    const messagesDiv = document.getElementById('copilotMessages');
    const inputEl = document.getElementById('copilotInput');
    const sendBtn = document.getElementById('copilotSend');
    const modeHelper = document.getElementById('modeHelper');
    const modeBypass = document.getElementById('modeBypass');

    trigger.addEventListener('click', () => window_el.classList.toggle('open'));
    closeBtn.addEventListener('click', () => window_el.classList.remove('open'));

    function switchMode(mode) {
        copilotMode = mode;
        modeHelper.classList.toggle('active', mode === 'helper');
        modeBypass.classList.toggle('active', mode === 'bypass');
    }

    function addMessage(text, type) {
        const msg = document.createElement('div');
        msg.className = `copilot-msg ${type}`;
        msg.innerText = text;
        messagesDiv.appendChild(msg);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function sendMessage() {
        const text = inputEl.value.trim();
        if (!text) return;
        addMessage(text, 'user');
        inputEl.value = '';
        addMessage('⏳ Думаю...', 'bot');
        const loadingMsg = messagesDiv.lastChild;

        try {
            if (copilotMode === 'bypass') {
                const res = await fetch(`https://bypass.tools/api/bypass?key=${BYPASS_KEY}&url=${encodeURIComponent(text)}`);
                const data = await res.json();
                loadingMsg.remove();
                if (data && data.key) addMessage(`🔑 Ключ: ${data.key}`, 'bot');
                else addMessage('❌ Не удалось обойти ссылку. Проверь ссылку или попробуй позже.', 'bot');
            } else {
                const res = await fetch('https://api.deepseek.com/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${DEEPSEEK_KEY}` },
                    body: JSON.stringify({
                        model: 'deepseek-chat',
                        messages: [
                            { role: 'system', content: 'Ты — Z1NTY Copilot. Ты знаешь всё о сайте Z1NTY Scripts Hub. Помогаешь с выбором скриптов, рассказываешь о плейсах, подсказываешь как что работает. Отвечай кратко и дружелюбно. Если вопрос не по теме сайта — вежливо отказывай.' },
                            { role: 'user', content: text }
                        ],
                        max_tokens: 300
                    })
                });
                const data = await res.json();
                loadingMsg.remove();
                const reply = data?.choices?.[0]?.message?.content || 'Извини, не смог ответить. Попробуй переформулировать.';
                addMessage(reply, 'bot');
            }
        } catch (e) {
            loadingMsg.remove();
            addMessage('⚠️ Ошибка соединения. Проверь интернет.', 'bot');
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    inputEl.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    console.log('✅ Z1NTY Scripts Hub загружен! Copilot готов.');
    </script>
</body>
</html>
